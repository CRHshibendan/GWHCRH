<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>翎鸣馆 · 鸟种详情</title>
<meta name="color-scheme" content="light dark">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* 主题切换圆形扩散动画(配合 theme.js 的 View Transitions) */
::view-transition-old(root),
::view-transition-new(root) {
    animation: none;
    mix-blend-mode: normal;
}

::view-transition-old(root) { z-index: 1; }
::view-transition-new(root) { z-index: 9999; }

/* ===== 深浅配色变量(与主页一致,共享 localStorage 偏好) ===== */
body {
    --bg: #fff;
    --text: #1d1d1f;
    --text-2: #424245;
    --text-dim: #86868b;
    --nav-bg: rgba(255, 255, 255, 0.85);
    --nav-border: rgba(0, 0, 0, 0.06);
    --chip-bg: #d8ffea;
    --green: #1d7a4a;
    --fig-bg: #f5f5f7;
    --related-bg: #f5f5f7;
    --card: #fff;
    --card-shadow: rgba(0, 0, 0, 0.08);
    --btn-bg: rgba(0, 0, 0, 0.05);
    --btn-border: rgba(0, 0, 0, 0.10);
    --btn-bg-hover: rgba(0, 0, 0, 0.09);
    --btn-border-hover: rgba(0, 0, 0, 0.16);
    --accent: #06c;
    color-scheme: light;
}

body.dark {
    --bg: #1b1b1f;
    --text: #f5f5f7;
    --text-2: #d6d6da;
    --text-dim: #a1a1a6;
    --nav-bg: rgba(27, 27, 31, 0.85);
    --nav-border: rgba(255, 255, 255, 0.08);
    --chip-bg: #1d4a35;
    --green: #5ee39a;
    --fig-bg: #2a2a30;
    --related-bg: #232328;
    --card: #2a2a30;
    --card-shadow: rgba(0, 0, 0, 0.5);
    --btn-bg: rgba(255, 255, 255, 0.08);
    --btn-border: rgba(255, 255, 255, 0.14);
    --btn-bg-hover: rgba(255, 255, 255, 0.14);
    --btn-border-hover: rgba(255, 255, 255, 0.22);
    --accent: #4aa8ff;
    color-scheme: dark;
}

body {
    font-family: "SF Pro Display", "SF Pro SC", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    transition: background 0.35s ease, color 0.35s ease;
}

ul { list-style: none; }
a { text-decoration: none; color: inherit; }

/* 顶部导航 */
.bd-nav {
    position: sticky;
    top: 0;
    z-index: 100;
    height: 60px;
    background: var(--nav-bg);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--nav-border);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

/* 主题切换按钮(与主页同款:悬停放大 + 光晕,月亮歪头、太阳自转) */
.bd-theme {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    border-radius: 50%;
    opacity: 0.85;
    transition: opacity 0.25s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.35s ease, background 0.25s ease;
}

.bd-theme svg {
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.bd-theme:hover {
    opacity: 1;
    transform: scale(1.25);
}

.bd-theme:hover .icon-moon {
    transform: rotate(-30deg);
}

.bd-theme .icon-sun { display: none; }

body.dark .bd-theme .icon-moon { display: none; }
body.dark .bd-theme .icon-sun { display: block; }

body.dark .bd-theme:hover .icon-sun {
    transform: rotate(180deg);
}

/* 返回按钮:底色跟随页面、稍亮一点,克制不抢戏 */
.bd-nav .back-home {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    border-radius: 999px;
    padding: 8px 22px 8px 16px;
    transition: background 0.25s ease, border-color 0.25s ease;
}

.bd-nav .back-home .arrow {
    display: inline-block;
    font-size: 16px;
    line-height: 1;
    transition: transform 0.25s ease;
}

.bd-nav .back-home:hover {
    background: var(--btn-bg-hover);
    border-color: var(--btn-border-hover);
}

.bd-nav .back-home:hover .arrow {
    transform: translateX(-4px);
}

/* Hero */
.bd-hero {
    padding: 90px 24px 70px;
    text-align: center;
}

.bd-hero .cat-chip {
    display: inline-block;
    background: var(--chip-bg);
    color: var(--green);
    font-size: 13px;
    font-weight: 600;
    border-radius: 999px;
    padding: 5px 16px;
    margin-bottom: 20px;
}

.bd-hero h1 {
    font-size: clamp(36px, 6vw, 64px);
    font-weight: 700;
    letter-spacing: -0.02em;
}

.bd-hero .latin {
    margin-top: 8px;
    font-style: italic;
    font-size: 16px;
    color: var(--text-dim);
}

.bd-figure {
    position: relative;
    max-width: 640px;
    margin: 40px auto 0;
    border-radius: 28px;
    overflow: hidden;
    background: var(--fig-bg);
    padding: 20px;
    transition: background 0.35s ease;
}

.bd-figure img {
    width: 100%;
    object-fit: contain;
    display: block;
    border-radius: 18px;
    transition: transform 0.5s ease, opacity 0.5s ease;
}

.bd-figure:hover img {
    transform: scale(1.06);
    opacity: 0.25;
}

.bd-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 22px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s ease;
}

.bd-figure:hover .bd-overlay {
    opacity: 1;
    pointer-events: auto;
}

.bd-overlay .bird-call {
    font-size: 15px;
    color: var(--text-2);
    max-width: 380px;
    line-height: 1.6;
}

.bd-overlay .bird-audio {
    margin-top: 14px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: #1d7a4a;
    border: none;
    border-radius: 999px;
    padding: 7px 20px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s;
}

.bd-overlay .bird-audio:hover { background: #16603b; }

/* 描述区 */
.bd-desc {
    max-width: 720px;
    margin: 44px auto 0;
    padding: 0 24px;
    font-size: 18px;
    line-height: 1.7;
    color: var(--text-2);
    text-align: center;
}

/* 您可能感兴趣 */
.bd-related {
    background: var(--related-bg);
    padding: 90px 24px 110px;
    margin-top: 80px;
    transition: background 0.35s ease;
}

.bd-related h2 {
    text-align: center;
    font-size: clamp(26px, 4vw, 40px);
    font-weight: 700;
    letter-spacing: -0.01em;
}

.bd-related .sub {
    text-align: center;
    margin-top: 8px;
    font-size: 15px;
    color: var(--text-dim);
}

.bd-related-grid {
    max-width: 1080px;
    margin: 44px auto 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 22px;
}

.bd-card {
    background: var(--card);
    border-radius: 22px;
    overflow: hidden;
    transition: transform 0.4s ease, box-shadow 0.4s ease, background 0.35s ease;
    cursor: pointer;
}

.bd-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 18px 44px var(--card-shadow);
}

.bd-card img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: contain;
    background: var(--card);
    display: block;
}

.bd-card .cap {
    padding: 16px 20px 20px;
}

.bd-card .cap strong { font-size: 17px; display: block; }

.bd-card .cap em { font-style: italic; font-size: 12px; color: var(--text-dim); display: block; margin-top: 2px; }

/* 错误兜底 */
.bd-notfound {
    text-align: center;
    padding: 120px 24px;
}

.bd-notfound h1 { font-size: 32px; margin-bottom: 12px; }

.bd-notfound p { color: var(--text-dim); }

/* 暗色下播放按钮提亮 */
body.dark .bd-overlay .bird-audio { background: #2e9e64; }
body.dark .bd-overlay .bird-audio:hover { background: #38b874; }

/* ===== 观鸟打卡按钮 ===== */
.bd-checkin {
    margin: 36px auto 0;
    display: flex;
    justify-content: center;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
}

.bd-checkin-btn {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: #1d7a4a;
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.25s ease, box-shadow 0.25s ease;
}

.bd-checkin-btn:hover { background: #16603b; transform: scale(1.05); }
.bd-checkin-btn:active { transform: scale(0.97); }

.bd-checkin-btn.checked {
    background: var(--chip-bg);
    color: var(--green);
    box-shadow: inset 0 0 0 1.5px var(--green);
}

.bd-checkin-hint {
    font-size: 12.5px;
    color: var(--text-dim);
}

</style>
</head>
<body>
<nav class="bd-nav">
    <a href="index.html" class="back-home"><span class="arrow">‹</span> 回到翎鸣馆</a>
    <a href="#" class="bd-theme" id="themeToggle" aria-label="切换深浅配色">
        <svg class="icon-moon" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true">
            <path d="M20.3 14.6A8.5 8.5 0 0 1 9.4 3.7 8.5 8.5 0 1 0 20.3 14.6z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
    </a>
</nav>

<div id="app"></div>

<script src="theme.js"></script>
<script>initThemeToggle('themeToggle');</script>
<script src="bird-data.js"></script>
<script src="records-sync.js"></script>
<script>
(function () {
    var app = document.getElementById('app');
    var params = new URLSearchParams(location.search);
    var name = params.get('name') || '';
    var i = findBird(name);
    var bird = i >= 0 ? BIRDS[i] : null;

    if (!bird) {
        app.innerHTML = '<div class="bd-notfound"><h1>没有找到这种鸟</h1>' +
            '<p>回到首页搜索试试,如"红隼"或拼音"hongsun"。</p>' +
            '<p style="margin-top:24px"><a href="index.html" style="color:#06c">回到翎鸣馆 ›</a></p></div>';
        return;
    }

    // 分类:从导航 data-bird 归属推断
    var CATS = ['鸻鹬类', '雁鸭类', '琵鹭', '猛禽', '鸥类', '攀禽', '鹤类', '鹳类', '其他'];
    var cat = params.get('cat') || '其他';

    // 同分类推荐:优先同分类,不足补随机
    var pool = BIRDS.filter(function (b) { return b.name !== bird.name; });
    var related = pool.slice().sort(function () { return Math.random() - 0.5; }).slice(0, 4);

    app.innerHTML =
        '<section class="bd-hero">' +
            '<span class="cat-chip">' + cat + '</span>' +
            '<h1>' + bird.name + '</h1>' +
            '<p class="latin">' + bird.latin + '</p>' +
            '<figure class="bd-figure">' +
                '<img id="bdImg" src="' + bird.images[0] + '" alt="' + bird.name + '">' +
                '<div class="bd-overlay">' +
                    '<p class="bird-call">' + bird.call + '</p>' +
                    '<button class="bird-audio" id="bdAudio">▶ 播放叫声</button>' +
                '</div>' +
            '</figure>' +
            '<p class="bd-desc">' + bird.desc + '</p>' +
            '<div class="bd-checkin">' +
                '<button class="bd-checkin-btn" id="checkinBtn"><span id="checkinIcon">✓</span> <span id="checkinText">我看过它</span></button>' +
                '<span class="bd-checkin-hint" id="checkinHint"></span>' +
            '</div>' +
        '</section>' +
        '<section class="bd-related">' +
            '<h2>您可能感兴趣</h2>' +
            '<p class="sub">随机推荐其他鸟种</p>' +
            '<div class="bd-related-grid">' +
                related.map(function (b) {
                    return '<div class="bd-card" data-name="' + b.name + '">' +
                        '<img src="' + b.images[0] + '" alt="' + b.name + '" loading="lazy">' +
                        '<div class="cap"><strong>' + b.name + '</strong><em>' + b.latin + '</em></div></div>';
                }).join('') +
            '</div>' +
        '</section>';

    // 叫声播放
    var btn = document.getElementById('bdAudio');
    var audio = null;
    btn.addEventListener('click', function () {
        if (audio && !audio.paused) {
            audio.pause();
            btn.textContent = '▶ 播放叫声';
            return;
        }
        audio = audio || new Audio(bird.audio);
        audio.currentTime = 0;
        audio.play();
        btn.textContent = '■ 停止';
        audio.addEventListener('ended', function () { btn.textContent = '▶ 播放叫声'; });
    });

    // 推荐卡点击:跳到该鸟详情页(同分类推荐猫传下去)
    document.querySelectorAll('.bd-card').forEach(function (card) {
        card.addEventListener('click', function () {
            location.href = 'bird.html?name=' + encodeURIComponent(card.getAttribute('data-name'));
        });
    });

    // ===== 观鸟打卡(云同步) =====
    var checkinBtn = document.getElementById('checkinBtn');
    var checkinText = document.getElementById('checkinText');
    var checkinIcon = document.getElementById('checkinIcon');
    var checkinHint = document.getElementById('checkinHint');

    function renderCheckin(seen) {
        checkinBtn.classList.toggle('checked', seen);
        checkinText.textContent = seen ? '已看过' : '我看过它';
        checkinIcon.textContent = seen ? '✓' : '👁';
    }

    // 初始状态
    renderCheckin(window.syncRecords.has(bird.name));

    // 云端记录到达后刷新(覆盖本地缓存初始值)
    window.syncRecords.fetch().then(function (r) {
        renderCheckin(r.records.indexOf(bird.name) >= 0);
        checkinHint.textContent = r.cloud ? '记录已云同步' : '';
    });

    checkinBtn.addEventListener('click', function () {
        var seen = !checkinBtn.classList.contains('checked');
        renderCheckin(seen);
        window.syncRecords.toggle(bird.name, seen).then(function (r) {
            renderCheckin(r.records.indexOf(bird.name) >= 0);
            checkinHint.textContent = r.cloud ? '记录已云同步' : '已保存到本设备';
        });
    });

    // 标题
    document.title = bird.name + ' · 翎鸣馆';
})();
</script>
</body>
</html>
