<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · 这片滩涂上什么也没有 - 翎鸣馆</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(160deg, #f2fbf5 0%, #e6f6ec 100%);
            color: #1d1d1f;
            padding: 24px;
        }
        .card {
            text-align: center;
            max-width: 420px;
        }
        .code {
            font-size: 84px;
            font-weight: 800;
            letter-spacing: -3px;
            color: #1d7a4a;
            line-height: 1;
        }
        .bird { font-size: 44px; margin: 10px 0 18px; }
        h1 { font-size: 21px; font-weight: 700; margin-bottom: 8px; }
        p { font-size: 14.5px; color: #6b7280; line-height: 1.7; margin-bottom: 26px; }
        .btn {
            display: inline-block;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: #1d7a4a;
            border-radius: 999px;
            padding: 12px 34px;
            text-decoration: none;
            transition: background .2s ease, transform .2s ease;
        }
        .btn:hover { background: #16603b; transform: scale(1.04); }
        @media (prefers-color-scheme: dark) {
            body { background: linear-gradient(160deg, #101512 0%, #0d1410 100%); color: #f0f0f2; }
            p { color: #9ca3af; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="code">404</div>
        <div class="bird" id="birdEmoji">🕊️</div>
        <h1>这片滩涂上什么也没有</h1>
        <p>你要找的页面飞走了。<span id="birdTip">潮水退了,鸟也换了地方觅食。</span></p>
        <a class="btn" href="/">回到翎鸣馆</a>
    </main>
    <script>
        // 彩蛋:随机展示一种鸟
        var birds = ['🕊️', '🦆', '🦢', '🦅', '🦉', '🐦', '🐧'];
        document.getElementById('birdEmoji').textContent =
            birds[Math.floor(Math.random() * birds.length)];
    </script>
</body>
</html>
